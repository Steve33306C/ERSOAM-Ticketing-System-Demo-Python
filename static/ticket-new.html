<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Ticket — ERS O&amp;M</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="shared.js"></script>
<script>
const session = requireRole(["admin", "engineer", "cs"]);
renderShell({
  active: "tickets", role: session.role, session,
  pageTitle: "Create New Ticket", pageSubtitle: "Submit a new field operation, troubleshoot, or maintenance request.",
});

const STATES = ["Johor","Kedah","Kelantan","Melaka","Negeri Sembilan","Pahang","Penang","Perak",
  "Perlis","Sabah","Sarawak","Selangor","Terengganu","Kuala Lumpur"];

let allClients = [];
let allAccounts = [];

document.getElementById("pageContent").innerHTML = `
  <a class="back-link" href="${session.role}.html">&larr; Back to Tickets</a>

  <div class="card">
    <h2><span class="form-section-num">1</span>Client Information</h2>
    <div class="field-row">
      <div>
        <label>Client / Organization *</label>
        <select id="f-client"><option value="">Select a client…</option></select>
      </div>
      <div>
        <label>Site / Installation (optional)</label>
        <select id="f-site" disabled><option value="">Select client first</option></select>
      </div>
    </div>
    <button class="secondary" onclick="openClientModal()">+ Add New Client</button>
  </div>

  <div class="card">
    <h2><span class="form-section-num">2</span>Ticket Details</h2>
    <div class="field-row">
      <div>
        <label>Ticket Type *</label>
        <select id="f-type">
          <option value="residential_servicing" selected>Residential Servicing</option>
          <option value="residential_troubleshooting">Residential Troubleshoot/Rectification</option>
          <option value="ci_servicing">C&amp;I Servicing</option>
          <option value="ci_troubleshooting">C&amp;I Troubleshoot/Rectification</option>
          <option value="site_survey">Site Survey</option>
          <option value="dere">DERE</option>
          <option value="ntp_phase_1">NTP Phase 1</option>
          <option value="ntp_phase_2">NTP Phase 2</option>
          <option value="ntp_phase_3">NTP Phase 3</option>
          <option value="ntp_phase_4">NTP Phase 4</option>
        </select>
      </div>
      <div>
        <label>Priority Level *</label>
        <select id="f-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium (Standard)</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>
    </div>
    <label>Description &amp; Findings *</label>
    <textarea id="f-desc" rows="3" placeholder="Detailed description of the reported problem, symptoms, or maintenance scope…"></textarea>
  </div>

  <div class="card">
    <h2><span class="form-section-num">3</span>System &amp; Equipment Information</h2>
    <p class="small">Optional — capture what's known now; nothing here blocks creating the ticket.</p>
    <div class="field-row">
      <div><label>Panels</label><input id="f-panels" type="text" placeholder="e.g. 10x Trina Solar 500W"></div>
      <div><label>Inverter Brand</label><input id="f-inv-brand" type="text" placeholder="e.g. Huawei / Sungrow / SMA"></div>
    </div>
    <div class="field-row">
      <div><label>Inverter Model / S/N</label><input id="f-inv-model" type="text" placeholder="e.g. SUN2000-10KTL-M1"></div>
      <div><label>NEMCD / Reference No.</label><input id="f-nemcd" type="text" placeholder="e.g. NEMCD-2024-998"></div>
    </div>
    <div class="field-row">
      <div><label>System Size</label><input id="f-syssize" type="text" placeholder="e.g. 24 kWp"></div>
    </div>
  </div>

  <div class="card">
    <h2><span class="form-section-num">4</span>Additional Details</h2>
    <label>Client Remarks / Notes</label>
    <textarea id="f-remarks" rows="2" placeholder="Special instructions, gate access codes, or client notes…"></textarea>
  </div>

  <div class="card">
    <h2><span class="form-section-num">5</span>Personnel Assignments</h2>
    <p class="small">Engineers, CS, and HOD only — Technicians work off the shared job board rather than
    ticket assignment, so they're deliberately not listed here. You (${session.name}) are added automatically.</p>
    <div id="assigneeList" class="checklist-box"></div>
  </div>

  <div id="create-error" class="small" style="color:#b91c1c;"></div>
  <button class="secondary" onclick="location.href='${session.role}.html'">Cancel</button>
  <button id="create-ticket-btn" onclick="submitTicket()">Create Ticket</button>

  <div id="clientModalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-dialog">
      <h2><span>Add New Client</span><button class="modal-close" onclick="closeClientModal()">&times;</button></h2>
      <label>Client Type</label>
      <div class="radio-row">
        <label><input type="radio" name="nctype" value="company" checked> Company</label>
        <label><input type="radio" name="nctype" value="individual"> Individual</label>
      </div>
      <label>Name</label>
      <input id="nc-name" type="text" placeholder="e.g. Solar Energy Sdn Bhd">
      <label>Contact Person</label>
      <input id="nc-contact" type="text">
      <div class="field-row">
        <div><label>Phone (optional)</label><input id="nc-phone" type="text"></div>
        <div><label>Email (optional)</label><input id="nc-email" type="text"></div>
      </div>
      <div class="field-row">
        <div><label>City (optional)</label><input id="nc-city" type="text"></div>
        <div><label>State</label><select id="nc-state">${STATES.map(s => `<option${s === "Selangor" ? " selected" : ""}>${s}</option>`).join("")}</select></div>
      </div>
      <div id="clientModalError" class="small" style="color:#b91c1c;"></div>
      <button onclick="submitNewClient()">Add Client</button>
      <button class="secondary" onclick="closeClientModal()">Cancel</button>
    </div>
  </div>
`;

document.getElementById("f-client").addEventListener("change", onClientChange);

function onClientChange() {
  const name = document.getElementById("f-client").value;
  const siteSel = document.getElementById("f-site");
  const client = allClients.find(c => c.name === name);
  if (!client) {
    siteSel.innerHTML = `<option value="">Select client first</option>`;
    siteSel.disabled = true;
    return;
  }
  if (!client.sites.length) {
    siteSel.innerHTML = `<option value="">No sites on file for this client</option>`;
    siteSel.disabled = true;
    return;
  }
  siteSel.disabled = false;
  siteSel.innerHTML = `<option value="">Select a site…</option>` + client.sites.map(s => `<option value="${s.name}">${s.name}</option>`).join("");
}

async function loadClients(selectName) {
  const { clients } = await api("/api/clients");
  allClients = clients;
  const sel = document.getElementById("f-client");
  sel.innerHTML = `<option value="">Select a client…</option>` + clients.map(c => `<option value="${c.name}">${c.name}</option>`).join("");
  if (selectName) { sel.value = selectName; onClientChange(); }
}

async function loadAccounts() {
  const { accounts } = await api("/api/accounts");
  allAccounts = accounts.filter(a => a.role !== "technician" && a.name !== session.name);
  const box = document.getElementById("assigneeList");
  box.innerHTML = allAccounts.length
    ? allAccounts.map(a => `<div class="checklist-item"><input type="checkbox" id="assignee-${a.id}" value="${a.name}"><label for="assignee-${a.id}" style="text-transform:none;font-weight:500;color:var(--text);margin:0;">${a.name}</label></div>`).join("")
    : emptyState("No other personnel to assign.", "users");
}

function openClientModal() { document.getElementById("clientModalOverlay").style.display = "flex"; }
function closeClientModal() {
  document.getElementById("clientModalOverlay").style.display = "none";
  document.getElementById("clientModalError").textContent = "";
  ["nc-name","nc-contact","nc-phone","nc-email","nc-city"].forEach(id => document.getElementById(id).value = "");
}
async function submitNewClient() {
  const type = document.querySelector('input[name="nctype"]:checked').value;
  const payload = {
    type,
    name: document.getElementById("nc-name").value,
    contact_person: document.getElementById("nc-contact").value,
    phone: document.getElementById("nc-phone").value,
    email: document.getElementById("nc-email").value,
    city: document.getElementById("nc-city").value,
    state: document.getElementById("nc-state").value,
    actor: session.name,
  };
  try {
    const created = await api("/api/clients", "POST", payload);
    closeClientModal();
    await loadClients(created.name);
  } catch (e) {
    document.getElementById("clientModalError").textContent = e.message;
  }
}

async function submitTicket() {
  const errEl = document.getElementById("create-error");
  errEl.textContent = "";
  const client = document.getElementById("f-client").value;
  if (!client) { errEl.textContent = "Please select a client."; return; }
  const description = document.getElementById("f-desc").value.trim();
  if (!description) { errEl.textContent = "Description & Findings is required."; return; }

  const initial_assignees = allAccounts
    .filter(a => document.getElementById(`assignee-${a.id}`).checked)
    .map(a => a.name);

  const payload = {
    actor: session.name,
    client,
    site: document.getElementById("f-site").value,
    type: document.getElementById("f-type").value,
    priority: document.getElementById("f-priority").value,
    description,
    initial_assignees,
    equipment: {
      panels: document.getElementById("f-panels").value,
      inverter_brand: document.getElementById("f-inv-brand").value,
      inverter_model: document.getElementById("f-inv-model").value,
      nemcd_ref: document.getElementById("f-nemcd").value,
    },
    additional: {
      system_size: document.getElementById("f-syssize").value,
      client_remarks: document.getElementById("f-remarks").value,
    },
  };

  // Fasa 6 audit (3 Okt) — button was never disabled while the request was
  // in flight, so a fast double-click could fire two create_ticket POSTs
  // before the first one redirected away, risking a duplicate ticket. Now
  // disabled immediately and only re-enabled on failure (success navigates
  // away anyway, so there's nothing to re-enable for).
  const btn = document.getElementById("create-ticket-btn");
  btn.disabled = true;
  try {
    const t = await api("/api/tickets", "POST", payload);
    location.href = `ticket-detail.html?id=${t.id}`;
  } catch (e) {
    errEl.textContent = e.message;
    btn.disabled = false;
  }
}

loadClients();
loadAccounts();
</script>
</body>
</html>
