<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Base — ERS O&amp;M</title>
<link rel="stylesheet" href="style.css">
<style>
/* Styles below are scoped under .kb-page (CSS variables declared on that
   wrapper) so they never leak into or clash with the rest of the ERS shell's
   own --panel/--text tokens. Lifted from the Knowledge Base file your friend
   built, trimmed to only the rules the 6 included sections actually use —
   Checklist/Site Visit/Safety/History/Articles-CMS/fake-shell CSS was left
   out on purpose (see chat for why). */
.kb-page{
  --bg:#F7F6F2; --panel:#FFFFFF; --panel-2:#F1EFE8;
  --line:#D9D5C6; --line-soft:#EDEBE2;
  --text:#22251F; --text-dim:#565A4C;
  --amber:#B4650A; --amber-dim:#FCEEDB;
  --teal:#12805B; --teal-dim:#DEF3EA;
  --red:#B23A32; --red-dim:#FBE9E6;
  --blue:#2E63A6;
  --shadow-sm:0 1px 2px rgba(30,28,20,0.05); --shadow-md:0 2px 10px rgba(30,28,20,0.06);
  font-family:inherit;
}
.kb-page h1,.kb-page h3,.kb-page h4{font-family:inherit;}

.emg-banner {
    display:flex;gap:8px;align-items:flex-start;
    background:var(--red-dim);border:1px solid var(--red);border-radius:8px;
    padding:12px 14px;font-size:13px;color:var(--red);margin-bottom:18px;line-height:1.5;
  }
.poster-header-icon {width:56px;height:56px;margin:0 auto 8px;color:var(--red);}
.poster-header-icon svg {width:100%;height:100%;}
.poster-header h1 {margin-top:0;}
.ppe-tagline {font-size:14px;font-weight:600;color:var(--amber);margin:2px 0 0;}
.ppe-grid {display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;}
.ppe-grid {grid-template-columns:1fr;}
.ppe-card {
    background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--ppe-color, var(--amber));
    border-radius:12px;padding:16px 14px;box-shadow:var(--shadow-sm);text-align:center;
  }
.ppe-photo {
    width:100%;height:110px;object-fit:contain;background:#fff;border-radius:8px;
    margin:-2px 0 10px;padding:6px;
  }
.ppe-icon {
    width:44px;height:44px;margin:0 auto 10px;color:var(--ppe-color, var(--amber));
    background:color-mix(in srgb, var(--ppe-color, var(--amber)) 18%, transparent);
    border-radius:50%;display:flex;align-items:center;justify-content:center;padding:10px;
  }
.ppe-card:has(.ppe-photo) .ppe-icon {width:30px;height:30px;padding:6px;margin-bottom:8px;}
.ppe-icon svg {width:100%;height:100%;}
.ppe-title {font-size:13.5px;font-weight:700;margin:0 0 6px;}
.ppe-tip {font-size:12px;color:var(--text-dim);line-height:1.5;margin:0;}
.ppe-fact {
    display:flex;gap:12px;align-items:flex-start;
    background:var(--amber-dim);border:1px solid var(--amber);border-radius:12px;
    padding:16px;margin-top:6px;
  }
.ppe-fact-icon {font-size:24px;flex-shrink:0;}
.ppe-fact-title {font-weight:700;font-size:13.5px;margin:0 0 4px;color:var(--amber);}
.ppe-fact-text {font-size:13px;color:var(--text-dim);line-height:1.55;margin:0;}
.qfg-search { width:100%; padding:14px 16px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-size:15px; margin-bottom:24px; font-family:inherit; }
.qfg-search:focus { outline:none; border-color:var(--amber); }
.qfg-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
.qfg-card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px; text-align:center; cursor:pointer; transition:0.2s; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:130px; }
.qfg-card:hover { border-color:var(--amber); transform:translateY(-2px); box-shadow:var(--shadow-md); }
.qfg-card .icon { font-size:30px; margin-bottom:10px; }
.qfg-card h4 { margin:0; font-size:14.5px; color:var(--text); }
.qfg-card.hidden { display:none; }
.qfg-answer-card { background:var(--panel); border:2px solid var(--amber); border-radius:12px; padding:28px; margin-top:8px; animation:qfgFadeIn 0.3s ease; }
.qfg-answer-top { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.qfg-flag { font-size:12.5px; font-weight:700; padding:6px 14px; border-radius:20px; background:var(--amber-dim); color:var(--amber); }
.qfg-answer-title { font-size:19px; font-weight:700; margin:0; color:var(--text); }
.qfg-answer-subtitle { font-size:13.5px; color:var(--text-dim); margin:4px 0 22px; }
.qfg-steps { list-style:none; padding:0; margin:0 0 12px; }
.qfg-step-row { display:flex; align-items:flex-start; gap:16px; padding:16px 0; border-bottom:1px solid var(--line); }
.qfg-step-row:last-child { border-bottom:none; }
.qfg-step-pic { flex-shrink:0; width:76px; height:56px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--text-dim); padding:8px; }
.qfg-step-pic svg { width:100%; height:100%; }
.qfg-step-text { font-size:14px; line-height:1.55; color:var(--text); padding-top:4px; }
.qfg-step-row--links { align-items:center; }
.qfg-brand-grid { display:flex; flex-wrap:wrap; gap:10px; padding-top:2px; }
.qfg-brand-btn {
    display:inline-block; padding:8px 18px; border-radius:20px;
    background:var(--panel-2); border:1.5px solid var(--amber);
    color:var(--amber); font-size:13.5px; font-weight:600;
    text-decoration:none; transition:background 0.15s, color 0.15s;
    font-family:inherit;
  }
.qfg-brand-btn:hover { background:var(--amber); color:#fff; }
.article-read {background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow-sm);}
.article-body h3 {font-size:17px;margin:18px 0 8px;}
.article-body h3:first-child {margin-top:0;}
.article-body h4 {font-size:14.5px;color:var(--amber);margin:16px 0 6px;}
.article-body p {font-size:14px;line-height:1.65;margin:0 0 10px;color:var(--text);}
.article-body ul, .article-body ol {margin:0 0 12px;padding-left:20px;}
.article-body li {font-size:14px;line-height:1.6;margin-bottom:5px;}
.article-body strong {color:var(--amber);}
.article-read-icon {
    width:48px;height:48px;flex-shrink:0;font-size:24px;border-radius:12px;
    background:color-mix(in srgb, var(--art-color, var(--amber)) 18%, transparent);
    display:flex;align-items:center;justify-content:center;
  }
.article-callout {
    display:flex;gap:10px;align-items:flex-start;
    background:var(--amber-dim);border:1px solid var(--amber);border-radius:10px;
    padding:12px 14px;margin:0 0 14px;font-size:13.5px;line-height:1.55;
  }
.article-callout b {color:var(--amber);}
.article-step-list {margin:0 0 14px;}
.article-step-num {
    width:24px;height:24px;border-radius:50%;flex-shrink:0;background:var(--amber);color:#1a1305;
    font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;
  }
.article-step-text {font-size:14px;line-height:1.6;padding-top:2px;}
.article-feedback-btns {display:flex;gap:10px;justify-content:center;}
.article-feedback-btn {
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:9px 16px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;
  }
.article-feedback-btn:hover {border-color:var(--amber);background:var(--amber-dim);}
.article-related-title {font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin:0 0 8px;}
.article-related-link {
    display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--blue);
    cursor:pointer;margin-bottom:6px;
  }
.article-related-link:hover {border-color:var(--blue);}
.path-container {display:flex;flex-direction:column;gap:10px;margin-bottom:20px;position:relative;padding-left:16px;border-left:2px dashed var(--line-soft);margin-left:10px;}
.path-step {background:var(--panel-2);border:1px solid var(--line);padding:12px 14px;border-radius:10px;position:relative;}
.path-step::before {content:'';position:absolute;left:-23px;top:16px;width:10px;height:10px;background:var(--amber);border-radius:50%;box-shadow:0 0 0 3px var(--panel);}
.path-step h4 {margin:0 0 4px;font-size:13.5px;color:var(--amber);display:flex;align-items:center;gap:8px;}
.path-step .step-num {background:var(--amber-dim);color:var(--amber);padding:2px 7px;border-radius:4px;font-size:11px;font-family:'IBM Plex Mono',monospace;}
.path-step p {margin:0;font-size:12.5px;color:var(--text-dim);}
.flow-list {list-style:none;padding:0;margin:0 0 20px;}
.flow-list li {display:flex;gap:12px;margin-bottom:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);align-items:flex-start;}
.flow-list li .icon {font-size:16px;flex-shrink:0;}
.flow-list li strong {display:block;font-size:13.5px;margin-bottom:3px;}
.flow-list li span {font-size:12px;color:var(--text-dim);line-height:1.5;}
.flow-list.dc-flow li {border-left:3px solid var(--amber);}
.flow-list.dc-flow li strong {color:var(--amber);}
.flow-list.ac-flow li {border-left:3px solid var(--blue);}
.flow-list.ac-flow li strong {color:var(--blue);}
.article-callout.accent {background:var(--amber-dim);border-color:var(--amber);}
.pdf-link-btn {
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--amber);color:#1a1305;font-weight:700;font-size:13.5px;
    padding:12px 20px;border-radius:8px;text-decoration:none;margin-top:16px;width:100%;
  }
.pdf-link-btn:hover {filter:brightness(1.08);}
.poster-flow {display:flex;flex-direction:column;}
.poster-card {
    display:flex;gap:14px;align-items:flex-start;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:2px;box-shadow:var(--shadow-sm);
  }
.poster-card.decision {background:var(--panel-2);border-color:var(--blue);}
.poster-card.loop {background:var(--panel-2);border-style:dashed;font-style:italic;}
.poster-card.loop .poster-title {font-size:13px;font-weight:600;color:var(--text-dim);}
.poster-card.decision .poster-icon {color:var(--blue);}
.poster-card.action .poster-icon {color:var(--amber);}
.poster-card.end.resolved {background:var(--teal-dim);border-color:var(--teal);}
.poster-card.end.resolved .poster-icon {color:var(--teal);}
.poster-card.end.danger {background:var(--red-dim);border-color:var(--red);}
.poster-card.end.danger .poster-icon {color:var(--red);}
.poster-icon {width:26px;height:26px;flex-shrink:0;}
.poster-icon svg {width:100%;height:100%;}
.poster-body {flex:1;}
.poster-title {font-weight:700;font-size:15px;margin:0 0 4px;line-height:1.35;}
.poster-tag {font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-weight:600;margin:0 0 4px;}
.poster-detail {font-size:13px;color:var(--text-dim);margin:0;line-height:1.55;}
.poster-step-image {width:100%;max-width:320px;border-radius:10px;margin-top:12px;display:block;border:1px solid var(--line);}
.poster-arrow {text-align:center;color:var(--text-dim);font-size:18px;margin:2px 0 6px;}
.poster-branches {display:flex;flex-direction:column;gap:14px;margin:10px 0 6px;}
.poster-branch {border-radius:12px;padding:12px;border:2px solid var(--line);}
.poster-branch.branch-yes {border-color:var(--teal);background:var(--teal-dim);}
.poster-branch.branch-no {border-color:var(--red);background:var(--red-dim);}
.poster-branch.branch-other {border-color:var(--amber);background:var(--amber-dim);}
.poster-branch-label {font-weight:700;font-size:13.5px;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.poster-branch-icon {width:17px;height:17px;flex-shrink:0;display:inline-flex;}
.poster-branch-icon svg {width:100%;height:100%;}
.poster-branch.branch-yes .poster-branch-icon {color:var(--teal);}
.poster-branch.branch-no .poster-branch-icon {color:var(--red);}
.poster-branch.branch-other .poster-branch-icon {color:var(--amber);}
.poster-branch-body .poster-card {background:var(--panel);}
.cat {
    display:flex;flex-direction:column;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--cat-color, var(--amber));
    border-radius:10px;
    width:100%;
    color:var(--text);
    box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease, transform .15s ease;
    overflow:hidden;
  }
.cat:hover {background:var(--panel-2);border-color:var(--line);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.cat-open {
    display:flex;align-items:center;gap:14px;width:100%;
    background:none;border:none;color:inherit;font:inherit;text-align:left;
    cursor:pointer;padding:16px;
  }
.cat-footer {
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 16px 12px;
  }
.vis-badge {
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
  }
.cat-edit-btn {
    background:none;border:1px solid var(--line);color:var(--text-dim);
    font-size:11px;padding:4px 9px;border-radius:6px;cursor:pointer;flex-shrink:0;
  }
.cat-edit-btn:hover {border-color:var(--amber);color:var(--amber);}
.modal-card {
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:380px;width:100%;box-shadow:var(--shadow-md);
  }
.modal-eyebrow {font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:0 0 4px;}
.modal-title {font-size:17px;margin:0 0 16px;}
.vis-option-list {display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.vis-option {
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;cursor:pointer;color:var(--text);
  }
.vis-option.active {border-color:var(--amber);}
.vis-option-icon {width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.vis-option-body {flex:1;display:flex;flex-direction:column;gap:1px;}
.vis-option-label {font-size:13.5px;font-weight:600;}
.vis-option-desc {font-size:11.5px;color:var(--text-dim);}
.vis-option-check {color:var(--amber);font-size:15px;}
.modal-close-btn {
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);
    background:none;color:var(--text);cursor:pointer;font-weight:600;
  }
.modal-close-btn:hover {border-color:var(--amber);color:var(--amber);}
.kb-preview-row {
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;margin-bottom:6px;
  }
.kb-preview-row-actions {display:flex;align-items:center;gap:8px;flex-shrink:0;}
.kb-preview-label {font-size:12.5px;color:var(--text-dim);}
.kb-preview-label b {color:var(--text);}
.kb-preview-btn {
    background:var(--amber-dim);border:1px solid var(--amber);color:var(--amber);
    font-size:12px;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer;flex-shrink:0;
  }
.kb-preview-btn:hover {background:var(--panel-2);}
.kb-hidden-note {font-size:11.5px;color:var(--text-dim);margin:-6px 0 14px;}
.kb-empty-note {font-size:13px;color:var(--text-dim);padding:18px 4px;text-align:center;}
.kb-section-add-btn {
    background:var(--teal-dim);border:1px solid var(--teal);color:var(--teal);
    font-size:12px;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer;flex-shrink:0;
  }
.kb-section-add-btn:hover {background:var(--panel-2);}
.art-status-badge {font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.art-status-badge.pub {color:var(--teal);}
.art-status-badge.draft {color:var(--text-dim);}
.kb-form-label {display:block;font-size:12.5px;font-weight:600;margin:0 0 4px;color:var(--text-dim);}
.kb-article-modal-card {max-width:560px;text-align:left;}
.cat-icon {
    width:42px;height:42px;border-radius:10px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
.cat-icon svg {width:22px;height:22px;}
.cat-body {flex:1;}
.cat-name {font-size:15px;font-weight:600;margin:0 0 2px;}
.cat-alarms {font-size:12.5px;color:var(--text-dim);margin:0;}
.cat-meta-badge {
    display:inline-block;font-size:10.5px;font-weight:700;margin-top:6px;
    padding:3px 8px;border-radius:20px;
  }
.kb-hero-icon {font-size:34px;flex-shrink:0;line-height:1.2;}
.kb-hero h1 {margin:0 0 4px;}
.kb-hero .sub {margin:0;}
.kb-section-head {
    display:flex;align-items:center;gap:8px;
    background:color-mix(in srgb, var(--kb-sec-color, var(--amber)) 12%, var(--panel-2));
    border-left:4px solid var(--kb-sec-color, var(--amber));
    border-radius:8px;padding:10px 12px;margin:20px 0 10px;
  }
.kb-section-icon {font-size:16px;}
.kb-section-title {font-weight:700;font-size:15px;color:var(--kb-sec-color, var(--amber));}
.cat-arrow {color:var(--text-dim);font-size:18px;flex-shrink:0;}
.back-btn {
    background:none;border:none;color:var(--text-dim);
    font-size:13px;cursor:pointer;padding:8px 0;
    display:flex;align-items:center;gap:5px;
  }
.back-btn:hover {color:var(--text);}
.top-back {margin-bottom:12px;}
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
// Knowledge Base — Engineer/Admin/CS only (matches the Tools tab's access:
// Technician is deliberately excluded per your request).
const session = requireRole(["admin", "engineer", "cs"]);
renderShell({
  active: "kb", role: session.role, session,
  pageTitle: "Knowledge Base", pageSubtitle: "Fault-finding guides, emergency response, PPE, solar basics, intern guide & customer quick-fix — reference material for the field team.",
});

// ===================================================================
// Everything below this line is lifted from the Knowledge Base file
// your friend built (knowledgebase.html), trimmed down to ONLY the 6
// approved sub-sections:
//   1. Fault-Finding Guides   4. Basic Solar Knowledge
//   2. Emergency Response     5. O&M Intern Survival Guide
//   3. PPE Guide              6. Customer Quick Fix Guide
// plus the EN/MS language toggle.
//
// Deliberately NOT included (per our earlier discussion):
//   - Activity Log (explicitly excluded by request)
//   - The file's own fake ERS shell/sidebar (ERS_MENU_ITEMS, renderErsShell,
//     dark-theme toggle) — replaced by the real renderShell() above
//   - Checklist / Site Visit / Safety Overview / History — separate
//     features in that file, unrelated to the Knowledge Base section
//   - A standalone "Articles CMS" (custom help-article editor) found while
//     tracing the code — it's a distinct feature in that file, never called
//     from inside the Knowledge Base screens, so it was left out rather than
//     silently added (it also wasn't one of the 6 sections you asked for).
// ===================================================================

const TREES = {
  utility: {
    label: "Utility-related alarms",
    code: "UTL",
    color: "#5B9BD9",
    alarms: "Utility loss, Vac fail, grid overvoltage, grid outage",
    start: "u0",
    nodes: {
      u0:{kind:"action",title:"Confirm it's safe to work",detail:"Confirm PPE is worn and isolators are safe to operate before touching any breaker or cable.",next:"u1"},
      u1:{kind:"action",title:"Check inverter display",next:"u2"},
      u2:{kind:"action",title:"Check AC isolator & MCCB condition",next:"u3"},
      u3:{kind:"decision",title:"Tripped?",options:[{label:"Yes",cls:"yes",next:"u3a"},{label:"No",cls:"no",next:"u6"}]},
      u3a:{kind:"decision",title:"Has this breaker tripped more than once recently?",detail:"Repeated trips point to an underlying fault — don't keep resetting.",options:[{label:"No, first trip",cls:"yes",next:"u4"},{label:"Yes, repeat trip",cls:"no",next:"refer_u"}]},
      u4:{kind:"action",title:"Reset MCCB / AC isolator",next:"u5"},
      u5:{kind:"action",title:"Restart inverter",next:"end_u"},
      u6:{kind:"action",title:"Measure AC side",next:"u7"},
      u7:{kind:"decision",title:"Within limit?",options:[{label:"Yes",cls:"yes",next:"u8"},{label:"No",cls:"no",next:"u11"}]},
      u8:{kind:"action",title:"Check AC cable & connection",next:"u9"},
      u9:{kind:"decision",title:"OK?",options:[{label:"Yes",cls:"yes",next:"u5"},{label:"No",cls:"no",next:"u10"}]},
      u10:{kind:"action",title:"Tighten / repair cable",next:"u5"},
      u11:{kind:"action",title:"Check grid supply",next:"end_u"},
      refer_u:{kind:"end",result:"refer",title:"Refer to engineer",detail:"Recurring trips need root-cause investigation before resetting again."},
      end_u:{kind:"end",result:"ok",title:"End"}
    }
  },

  relay:{
    label:"Internal / relay alarm",
    code:"REL",
    color:"#B67FE0",
    alarms:"Relay check fail",
    start:"r1",
    nodes:{

  "Frequently Asked Questions": "Soalan Lazim",
  "Will my TNB bill really go to zero?": "Adakah bil TNB saya benar-benar akan menjadi sifar?",
  "Solar output varies by weather and season, so some months you export more than you use (bill near zero), other months less (higher bill). It's not a fixed number.": "Output solar berbeza mengikut cuaca dan musim, jadi sesetengah bulan anda mengeksport lebih daripada penggunaan (bil hampir sifar), bulan lain kurang (bil lebih tinggi). Ia bukan angka tetap.",
  "Why do I still pay something even with solar?": "Mengapa saya masih perlu membayar walaupun ada solar?",
  "Solar credit only offsets Energy, Capacity, and Network charges. Retail Charge, Service Tax, and KWTBB always apply, no matter how much solar you generate.": "Kredit solar hanya menampung Caj Tenaga, Kapasiti, dan Rangkaian. Caj Peruncitan, Cukai Perkhidmatan, dan KWTBB sentiasa dikenakan, tidak kira berapa banyak solar yang dijana.",
  "Why did my bill suddenly go up this month?": "Mengapa bil saya tiba-tiba naik bulan ini?",
  "Usually one of: less sunlight that month (haze, monsoon season), higher household usage, or the AFA rate changed — it adjusts monthly.": "Biasanya salah satu daripada: kurang cahaya matahari bulan itu (jerebu, musim tengkujuh), penggunaan isi rumah lebih tinggi, atau kadar AFA berubah — ia diselaraskan setiap bulan.",
  "My bill shows a negative number — do I get cash back?": "Bil saya menunjukkan angka negatif — adakah saya dapat wang tunai balik?",
  "No — a negative balance becomes a credit that's deducted from future bills, not a cash refund.": "Tidak — baki negatif menjadi kredit yang ditolak daripada bil akan datang, bukan bayaran balik tunai.",
  "What happens if I use more electricity than my panels generate?": "Apa berlaku jika saya guna lebih elektrik daripada yang dijana panel saya?",
  "You simply draw the extra electricity from the grid as normal — TNB bills you for that difference at standard rates, same as before you had solar.": "Anda hanya menarik elektrik tambahan daripada grid seperti biasa — TNB akan mengenakan bil untuk perbezaan itu pada kadar standard, sama seperti sebelum anda ada solar.",
  "My NEM balance is accumulating, so why is my bill still high this month?": "Baki NEM saya semakin terkumpul, jadi mengapa bil saya masih tinggi bulan ini?",
  "Your accumulated credit only offsets Energy, Capacity, and Network charges — never Retail, Service Tax, or KWTBB. A high bill usually means you exported less or used more than usual this month, not that your credit disappeared.": "Kredit terkumpul anda hanya menampung Caj Tenaga, Kapasiti, dan Rangkaian — tidak pernah Peruncitan, Cukai Perkhidmatan, atau KWTBB. Bil tinggi biasanya bermaksud anda mengeksport kurang atau menggunakan lebih daripada biasa bulan ini, bukan kredit anda hilang.",
  "Does my NEM credit expire? What happens if I don't use it?": "Adakah kredit NEM saya luput? Apa berlaku jika saya tidak menggunakannya?",
  "Yes — NEM credit has an expiry date shown on the bill (e.g., 31.12.2026). Unused credit is forfeited after that date, so it doesn't roll over forever.": "Ya — kredit NEM mempunyai tarikh luput yang ditunjukkan pada bil (cth., 31.12.2026). Kredit yang tidak digunakan akan hangus selepas tarikh itu, jadi ia tidak berterusan selama-lamanya.",

function tt(str){ if(state.lang !== 'ms') return str; return STR_MS[str] || str; }

function posterOptionIcon(cls){
  const key = cls === 'yes' ? 'check-circle' : cls === 'no' ? 'x-circle' : 'dot';
  return `<span class="poster-branch-icon">${EMG_ICONS[key]}</span>`;
}

function renderPosterNode(nodeId, tree, depth, visited, withIcons){
  if(withIcons === undefined) withIcons = true;
  if(!visited) visited = new Set();
  if(depth > 60) return '';
  const node = tree.nodes[nodeId];
  if(!node) return '';

  if(visited.has(nodeId)){
    // cycle guard: point back to the earlier step instead of re-rendering it
    return `<div class="poster-card loop">
      <div class="poster-body">
        <p class="poster-title">&#8630; Return to: ${esc(node.title)}</p>
      </div>
    </div>`;
  }
  const seen = new Set(visited);
  seen.add(nodeId);

  if(node.kind === 'end'){
    const ok = node.result === 'ok';
    return `<div class="poster-card end ${ok?'resolved':'danger'}">
      ${withIcons ? `<div class="poster-icon">${emgIcon(node.icon, ok ? 'first-aid' : 'alert-triangle')}</div>` : ''}
      <div class="poster-body">
        <p class="poster-title">${esc(node.title)}</p>
        <p class="poster-tag">${ok ? esc(t('poster.resolved')) : esc(t('poster.refer'))}</p>
        ${node.detail ? `<p class="poster-detail">${esc(node.detail)}</p>` : ''}
        ${node.image ? `<img class="poster-step-image" src="${esc(node.image)}" alt="${esc(node.title)}"/>` : ''}
      </div>
    </div>`;
  }

  if(node.kind === 'action'){
    return `<div class="poster-card action">
      ${withIcons ? `<div class="poster-icon">${emgIcon(node.icon, 'alert-triangle')}</div>` : ''}
      <div class="poster-body">
        <p class="poster-title">${esc(node.title)}</p>
        ${node.detail ? `<p class="poster-detail">${esc(node.detail)}</p>` : ''}
        ${node.image ? `<img class="poster-step-image" src="${esc(node.image)}" alt="${esc(node.title)}"/>` : ''}
      </div>
    </div>
    <div class="poster-arrow">&#8595;</div>
    ${renderPosterNode(node.next, tree, depth+1, seen, withIcons)}`;
  }

  // decision — render the question, then each branch as its own labeled, color-coded block
  let html = `<div class="poster-card decision">
    ${withIcons ? `<div class="poster-icon">${emgIcon(node.icon, 'search')}</div>` : ''}
    <div class="poster-body">
      <p class="poster-title">${esc(node.title)}</p>
    </div>
  </div>
  <div class="poster-branches">`;
  node.options.forEach(o=>{
    const cls = o.cls === 'yes' ? 'branch-yes' : o.cls === 'no' ? 'branch-no' : 'branch-other';
    html += `<div class="poster-branch ${cls}">
      <div class="poster-branch-label">${posterOptionIcon(o.cls)} ${esc(o.label)}</div>
      <div class="poster-branch-body">${renderPosterNode(o.next, tree, depth+1, seen, withIcons)}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderVisibilityEditorModal(){
  const key = state.knowledge.editingVisibility;

    || (TREES[key] && TREES[key].label)
    || (key === 'ppe_guide' ? 'Site Safety & PPE Guidelines' : key);
  const options = ['internal','intern_admin','customer','public'].map(level=>{
    const meta = KB_VISIBILITY_META[level];
    const active = level === current;
    return `<button class="vis-option ${active?'active':''}" onclick="kbSetVisibility('${key}','${level}')">
      <span class="vis-option-icon" style="color:${meta.color};background:${meta.bg};">${meta.icon}</span>

      <div class="vis-option-list">${options}</div>
      <button class="modal-close-btn" onclick="kbCloseVisibilityEditor()">Done</button>
    </div>
  </div>`;
}

function kbArticleAddAttachment() {
  const f = state.knowledge.articleForm;
  if (!f) return;
  if (f.attachments.length >= 10) { showToast("A maximum of 10 attachments is allowed."); return; }
  // Mock upload — same pattern used for report/checklist media elsewhere in
  // this system (see addMedia() in report.html): no real file capture in
  // this prototype, a typed label stands in for the file.
  const label = prompt("File name (this prototype can't store real files — enter a filename to represent it):", "");
  if (!label || !label.trim()) return;
  f.attachments.push(label.trim());
  render();

function kbArticleRemoveAttachment(index) {
  const f = state.knowledge.articleForm;
  if (!f) return;
  f.attachments.splice(index, 1);
  render();

async function kbSubmitArticleForm() {
  const f = state.knowledge.articleForm;
  if (!f || f.saving) return;
  const title = (f.title || "").trim();
  if (!title) { f.error = "Article title is required."; render(); return; }
  f.saving = true;
  f.error = "";
  render();
  try {
    const payload = {
      title, category: f.category, visibility: f.visibility, body: f.body || "",
      attachments: f.attachments, actor: session.name,
    };
    if (f.mode === "new") {
      await api("/api/kb_articles", "POST", payload);
    } else {
      await api(`/api/kb_articles/${f.id}/update`, "POST", payload);
    }
    state.knowledge.articleForm = null;
    await kbLoadArticles();
  } catch (e) {
    f.saving = false;
    f.error = e.message;
    render();
  }
}

// Strips the lightweight markdown markup down to plain text for the card
// preview blurb — same idea as the friend's-file mdLite() this replaces,
// just simpler since it only needs to feed a one-line preview, not render.
function kbArticlePlainPreview(body) {
  const plain = (body || "")
    .replace(/^#{2,3}\s*/gm, "")
    .replace(/^-\s*/gm, "")
    .replace(/\*\*(.+?)\*\*/g, "$1")
    .replace(/\n+/g, " ")
    .trim();
  return plain.length > 140 ? plain.slice(0, 140) + "…" : plain;
}

// Renders an article's body: "## "/"### " headings, "- " bullets, "**bold**",
// and a "**Label:** text" line becomes a highlighted callout box (reuses
// .article-callout, already styled for the hardcoded guides above — see
// renderEmergencyPoster/renderPpeGuide for other users of that same class).
function renderKbArticleBody(text) {
  const lines = (text || "").split("\n");
  let html = "";
  let listType = null;
  function closeList() { if (listType) { html += listType === "ul" ? "</ul>" : "</ol>"; listType = null; } }
  function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
  lines.forEach(line => {
    const t = line.trim();
    const callout = t.match(/^\*\*(.+?):\*\*\s*(.*)$/);
    if (t.startsWith("### ")) { closeList(); html += `<h4>${inline(t.slice(4))}</h4>`; }
    else if (t.startsWith("## ")) { closeList(); html += `<h3>${inline(t.slice(3))}</h3>`; }
    else if (callout) { closeList(); html += `<div class="article-callout"><span>&#9888;</span><div><b>${esc(callout[1])}:</b> ${inline(callout[2])}</div></div>`; }
    else if (t.startsWith("- ")) { if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; } html += `<li>${inline(t.slice(2))}</li>`; }
    else if (/^\d+\.\s/.test(t)) { if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; } html += `<li>${inline(t.replace(/^\d+\.\s/, ""))}</li>`; }
    else if (t === "") { closeList(); }
    else { closeList(); html += `<p>${inline(t)}</p>`; }
  });
  closeList();
  return html || `<p class="kb-empty-note">No content yet.</p>`;
}

function renderKbCard(key, colorVar, iconHtml, name, desc, openFn, metaBadge){
  const isStaff = state.knowledge.previewMode !== 'customer';
  const level = kbGetVisibility(key);
  if(!isStaff && (level === 'internal' || level === 'intern_admin')) return null;
  return `<div class="cat" style="--cat-color:${colorVar}">
    <button class="cat-open" onclick="${openFn}">
      <span class="cat-icon" style="color:${colorVar};background:${colorVar}26;">${iconHtml}</span>
      <span class="cat-body">
        <p class="cat-name">${esc(name)}</p>
        <p class="cat-alarms">${esc(desc)}</p>
        ${metaBadge ? `<span class="cat-meta-badge" style="color:${colorVar};background:${colorVar}1a;">${esc(metaBadge)}</span>` : ''}
      </span>
      <span class="cat-arrow">&rarr;</span>
    </button>
    ${renderVisibilityFooter(key)}
  </div>`;
}

function renderKbHome(){
  const kbEntries = Object.entries(KB_TREES);
  const emgEntries = Object.entries(TREES).filter(([key]) => EMERGENCY_TREE_KEYS.includes(key));
  const isStaff = state.knowledge.previewMode !== 'customer';

  const kbCardsArr = kbEntries.map(([key, tree]) => {
    const ms = KB_MS[key] || {};
    const label = state.lang === 'ms' && ms.__label ? ms.__label : tree.label;
    const desc = state.lang === 'ms' && ms.__desc ? ms.__desc : tree.desc;
    return renderKbCard(key, tree.color, emgIcon(tree.icon, 'report'), label, desc, `kbOpenFlow('${key}')`);
  }).filter(Boolean);

  const emgCardsArr = emgEntries.map(([key, tree]) => {
    const ms = EMG_MS[key] || {};
    const label = state.lang === 'ms' && ms.__label ? ms.__label : tree.label;
    const alarms = state.lang === 'ms' && ms.__alarms ? ms.__alarms : tree.alarms;
    return renderKbCard(key, '#D9534F', emgIcon(tree.icon, 'alert-triangle'), label, alarms, `kbOpenFlow('${key}')`);
  }).filter(Boolean);

  const ppeCardHtml = renderKbCard('ppe_guide', '#F2994A', EMG_ICONS['hard-hat'],
    tt('Site Safety & PPE Guidelines'),
    tt('General knowledge — not a checklist, just a quick, friendly guide to your gear'),
    `kbOpenFlow('ppe_guide')`);
  const ppeCardsArr = ppeCardHtml ? [ppeCardHtml] : [];

  const solarCardHtml = renderKbCard('basic_solar_knowledge', '#5B9BD9', EMG_ICONS['report'],
    tt('Basic Solar Knowledge'),
    tt('Fundamentals of Solar PV Monitoring & Performance Review'),
    `kbOpenFlow('basic_solar_knowledge')`);
  const solarCardsArr = solarCardHtml ? [solarCardHtml] : [];

  const internCardHtml = renderKbCard('intern_guide', '#B67FE0', EMG_ICONS['report'],
    tt('O&M Intern Survival Guide'),
    tt('Welcome to the Operations & Maintenance Team! Here are the unwritten rules and everything you need to succeed.'),
    `kbOpenFlow('intern_guide')`);
  const internCardsArr = internCardHtml ? [internCardHtml] : [];

  const qfgCardHtml = renderKbCard('quick_fix_guide', '#D9534F', EMG_ICONS['alert-triangle'],
    tt('Customer Quick Fix Guide'),
    tt('Safe visual checks & restart steps a customer can do before calling for help'),
    `kbOpenFlow('quick_fix_guide')`);
  const qfgCardsArr = qfgCardHtml ? [qfgCardHtml] : [];

  const totalCount = kbEntries.length + emgEntries.length + 3;
  const shownCount = kbCardsArr.length + emgCardsArr.length + ppeCardsArr.length + solarCardsArr.length + internCardsArr.length + qfgCardsArr.length;
  // Fasa 8 audit (5 Okt) — hiddenCount used to only tally the hardcoded guide
  // trees above; staff-authored articles hidden from the customer preview
  // (draft, or published but internal-only) weren't counted at all, so this
  // banner under-reported how many items the customer preview was actually
  // hiding. renderKbArticleCard() already applies the real hide-rule (not
  // published, or visibility isn't customer/public) — just reuse it here.
  const allArticles = state.knowledge.articles || [];
  const articlesHiddenCount = isStaff ? 0 : allArticles.filter(a =>
    a.status !== "published" || (a.visibility !== "customer" && a.visibility !== "public")
  ).length;
  const hiddenCount = (totalCount - shownCount) + articlesHiddenCount;

  const previewRow = `<div class="kb-preview-row">
    <span class="kb-preview-label">${isStaff
      ? 'Staff view — showing every article, whatever its audience.'
      : `<b>Customer preview</b> — showing only what a customer would see.`}</span>
    <div class="kb-preview-row-actions">
      ${isStaff ? `<button class="kb-section-add-btn" onclick="kbOpenNewArticleModal()">+ Add Article</button>` : ''}
      <button class="kb-preview-btn" onclick="kbTogglePreview()">${isStaff ? '&#128100; Preview as customer' : '&#8617; Back to staff view'}</button>
    </div>
  </div>`;
  const hiddenNote = (!isStaff && hiddenCount > 0)
    ? `<p class="kb-hidden-note">${hiddenCount} internal-only article${hiddenCount===1?'':'s'} hidden in this preview.</p>` : '';
  // Staff Articles (5 Okt, moved 5 Okt) — articles no longer get their own
  // standalone section; each one is filed into whichever existing section
  // matches its category (see articlesForCategory() + the section grids

  const articlesNote = (!state.knowledge.articlesLoaded && !state.knowledge.articlesError)
    ? `<p class="kb-empty-note">Loading articles…</p>`
    : state.knowledge.articlesError
      ? `<p class="kb-empty-note">Couldn't load articles — ${esc(state.knowledge.articlesError)}</p>`
      : '';
  const articlesForCategory = (cat) => (state.knowledge.articles || [])
    .filter(a => a.category === cat)
    .map(renderKbArticleCard)
    .filter(Boolean);

  const emptyState = (arr) => arr.length ? arr.join('') : `<p class="kb-empty-note">Nothing published to customers here yet.</p>`;

  return `

      <span class="kb-hero-icon">&#128218;</span>
      <div>
        <h1>${esc(isStaff ? t('kb.title') : (state.lang==='ms' ? 'Pusat Bantuan' : 'Help Center'))}</h1>
        <p class="sub">${esc(isStaff ? t('kb.subtitle') : (state.lang==='ms' ? 'Panduan ringkas untuk sistem solar anda.' : 'Friendly guides for your solar system.'))}</p>
      </div>
    </div>
    ${previewRow}${hiddenNote}${articlesNote}

    <div class="kb-section-head" style="--kb-sec-color:#D9534F;">
      <span class="kb-section-icon">&#128295;</span>
      <span class="kb-section-title">${esc(state.lang==='ms' ? 'Panduan Pelanggan' : 'Customer Guides')}</span>
    </div>
    <div class="grid">${emptyState([...qfgCardsArr, ...articlesForCategory('Customer Guides')])}</div>

    <div class="kb-section-head" style="--kb-sec-color:#F2994A;">
      <span class="kb-section-icon">&#128161;</span>
      <span class="kb-section-title">${esc(t('kb.general'))}</span>
    </div>
    <div class="grid">${emptyState([...solarCardsArr, ...ppeCardsArr, ...articlesForCategory('General Knowledge')])}</div>

    <div class="kb-section-head" style="--kb-sec-color:#B67FE0;">
      <span class="kb-section-icon">&#127891;</span>
      <span class="kb-section-title">${esc(state.lang==='ms' ? 'Sumber Intern' : 'Intern Resources')}</span>
    </div>
    <div class="grid">${emptyState([...internCardsArr, ...articlesForCategory('Intern Resources')])}</div>

    <div class="kb-section-head" style="--kb-sec-color:#5B9BD9;">
      <span class="kb-section-icon">&#128218;</span>
      <span class="kb-section-title">${esc(t('kb.flowcharts'))}</span>
    </div>
    <div class="grid">${emptyState([...kbCardsArr, ...articlesForCategory('Flowcharts')])}</div>

    <div class="kb-section-head" style="--kb-sec-color:#D9534F;">
      <span class="kb-section-icon">&#9888;&#65039;</span>
      <span class="kb-section-title">${esc(t('kb.emergency'))}</span>
    </div>
    <div class="emg-banner">&#9888; ${tt("In a real emergency, call emergency services first — this guide supports first response, it doesn't replace it.")}</div>
    <div class="grid">${emptyState([...emgCardsArr, ...articlesForCategory('Emergency Response')])}</div>
  `;
}

function localizeKbTree(tree, translations){
  if(state.lang !== 'ms' || !translations) return tree;
  const cloned = JSON.parse(JSON.stringify(tree));
  Object.keys(cloned.nodes).forEach(id=>{
    const tr = translations[id];
    if(!tr) return;
    if(tr.title) cloned.nodes[id].title = tr.title;
    if(tr.detail !== undefined) cloned.nodes[id].detail = tr.detail;
    if(tr.options && cloned.nodes[id].options){
      cloned.nodes[id].options.forEach((o, i)=>{ if(tr.options[i]) o.label = tr.options[i]; });
    }
  });
  return cloned;
}

function renderKbPoster(key){
  const rawTree = KB_TREES[key];
  if(!rawTree){ state.knowledge.activeFlow = null; return renderKbHome(); }
  const tree = localizeKbTree(rawTree, KB_MS[key]);
  const ms = KB_MS[key] || {};
  const label = state.lang === 'ms' && ms.__label ? ms.__label : tree.label;
  const desc = state.lang === 'ms' && ms.__desc ? ms.__desc : tree.desc;
  return `
    <button class="back-btn top-back" onclick="kbBack()">${t('back.allReferences')}</button>
    <div class="poster-header">
      <div class="poster-header-icon" style="color:${rawTree.color};">${emgIcon(rawTree.icon, 'report')}</div>
      <h1>${esc(label)}</h1>
      <p class="sub">${esc(desc)}</p>
      ${state.knowledge.previewMode !== 'customer' ? `<div style="display:flex;justify-content:center;">${renderVisibilityFooter(key)}</div>` : ''}
    </div>
    <div class="poster-flow">
      ${renderPosterNode(tree.start, tree, 0, new Set(), true)}
    </div>
  `;
}

// Minimal page state — just what the Knowledge Base screens above actually
// read (state.lang + state.knowledge.*). Everything else that file's global
// `state` object carried (checklist/site-visit/safety/history/articles) was
// cut along with those out-of-scope features.
const state = {
  lang: "en",
  knowledge: {
    activeFlow: null,
    previewMode: "staff",
    editingVisibility: null,
    visibility: {},
    qfgSearch: "",
    qfgSelected: null,
    // Staff Articles (5 Okt) — real, persisted articles (db.json
    // "kb_articles" via server.py), separate from the hardcoded guide trees
    // above. articles/articlesLoaded/articlesError are filled by
    // kbLoadArticles() below; activeArticleId switches the page into the
    // read view for one article; articleForm holds the in-progress
    // Add/Edit modal (null = modal closed).
    articles: [],
    articlesLoaded: false,
    articlesError: "",
    activeArticleId: null,
    articleForm: null,
  },
};

// Replaces the original file's app-wide render() dispatcher (which redrew
// the whole fake app — checklist, site visit, safety, history, everything)
// with a small page-local one that only ever redraws this page's own
// Knowledge Base content, the same "re-render into #pageContent" pattern
// every other ERS page already uses.
function render() {
  document.getElementById("pageContent").innerHTML = `<div class="kb-page">${renderKnowledgeBase()}</div>`;
}

render();
kbLoadArticles();
</script>
